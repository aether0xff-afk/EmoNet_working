name: TRACE Mechanism Analysis

on:
  pull_request:
    paths:
      - "v3/**"
      - "v3.1/scripts/analyze_trace_mechanism.py"
      - "v3.1/configs/final_dynamics_v1.json"
      - "v3.1/outputs/neural_trace_final_candidate_thr064_topk2_clip15_inh018_full80/neural_trace_summary.csv"
      - ".github/workflows/trace-mechanism-analysis.yml"
  workflow_dispatch:

jobs:
  trace-mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            v3/emonet
            v3.1/scripts/export_neural_activation_traces.py
            v3.1/scripts/analyze_trace_mechanism.py
            v3.1/configs/final_dynamics_v1.json
            v3.1/outputs/neural_trace_final_candidate_thr064_topk2_clip15_inh018_full80/neural_trace_summary.csv
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: python -m pip install numpy

      - name: Compile analysis
        run: python -m py_compile v3.1/scripts/analyze_trace_mechanism.py

      - name: Run 80-sample mechanism ablation
        run: |
          python -u v3.1/scripts/analyze_trace_mechanism.py \
            --limit 80 \
            --seed 42 \
            --output-dir v3.1/outputs/trace_mechanism_v1

      - name: Upload mechanism report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-mechanism-v1
          path: v3.1/outputs/trace_mechanism_v1/
          if-no-files-found: warn
