name: v5.10-hidden-prior-visible-window

on:
  pull_request:
    paths:
      - 'v5_10_hidden_prior_visible_window/**'
      - '.github/workflows/v5.10-hidden-prior-visible-window.yml'
  push:
    branches: ['feature/v5.10-hidden-prior-visible-window']

jobs:
  hidden-prior-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            v5_clean
            v5_6_dual_timescale_state
            v5_7_residual_fast_dynamics
            v5_8_adaptive_fast_dynamics
            v5_9_2_trajectory_attribution
            v5_10_hidden_prior_visible_window
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy-only dependencies
        run: python -m pip install -e './v5_clean[dev]'
      - name: Recheck frozen v5.7 and v5.8 dynamics
        run: |
          pytest -q v5_7_residual_fast_dynamics/tests
          pytest -q v5_8_adaptive_fast_dynamics/tests
      - name: Verify v5.10 hidden-prior construction
        run: pytest -q v5_10_hidden_prior_visible_window/tests
      - name: Run leave-one-vector-world-out hidden-prior benchmark
        shell: bash
        run: |
          set -o pipefail
          mkdir -p v5_10_hidden_prior_visible_window/outputs/hidden_prior_visible_window
          python v5_10_hidden_prior_visible_window/experiments/run_hidden_prior_benchmark.py 2>&1 \
            | tee v5_10_hidden_prior_visible_window/outputs/hidden_prior_visible_window/run.log
      - name: Upload benchmark output and debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5.10-hidden-prior-visible-window
          path: v5_10_hidden_prior_visible_window/outputs/hidden_prior_visible_window/
          if-no-files-found: error
