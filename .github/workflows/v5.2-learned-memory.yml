name: v5.2-learned-memory

on:
  pull_request:
    paths:
      - 'v5_2_learned_memory/**'
      - '.github/workflows/v5.2-learned-memory.yml'
  push:
    branches:
      - 'feature/v5.2-learned-memory-core'
    paths:
      - 'v5_2_learned_memory/**'
      - '.github/workflows/v5.2-learned-memory.yml'

jobs:
  learned-memory-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            v5_clean
            v5_1_semantic_context
            v5_2_learned_memory
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen core and v5.2 dependencies
        run: python -m pip install -e './v5_clean[dev]' sentence-transformers

      - name: Run v5.2 unit tests
        run: pytest -q v5_2_learned_memory/tests

      - name: Recheck inherited semantic fixture controls
        run: pytest -q v5_1_semantic_context/tests

      - name: Run v5.2 learned-memory benchmark
        run: python v5_2_learned_memory/experiments/run_learned_memory_benchmark.py

      - name: Upload v5.2 benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5.2-learned-memory-benchmark
          path: v5_2_learned_memory/outputs/learned_memory_benchmark/
          if-no-files-found: error
