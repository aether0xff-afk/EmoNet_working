name: v5.2.1-memory-readout

on:
  pull_request:
    paths:
      - 'v5_2_1_memory_readout_diagnostic/**'
      - '.github/workflows/v5.2.1-memory-readout.yml'
  push:
    branches:
      - 'feature/v5.2.1-memory-readout-diagnostic'
    paths:
      - 'v5_2_1_memory_readout_diagnostic/**'
      - '.github/workflows/v5.2.1-memory-readout.yml'

jobs:
  memory-readout-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            v5_clean
            v5_1_semantic_context
            v5_2_learned_memory
            v5_2_1_memory_readout_diagnostic
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen v5.2 dependencies
        run: python -m pip install -e './v5_clean[dev]' sentence-transformers

      - name: Recheck v5.2 core tests
        run: pytest -q v5_2_learned_memory/tests

      - name: Run v5.2.1 readout diagnostic
        run: python v5_2_1_memory_readout_diagnostic/experiments/run_readout_diagnostic.py

      - name: Upload v5.2.1 diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5.2.1-memory-readout-diagnostic
          path: v5_2_1_memory_readout_diagnostic/outputs/memory_readout_diagnostic/
          if-no-files-found: error
