name: v5.4.1-contrastive-readout-diagnostic

on:
  pull_request:
    paths:
      - 'v5_4_1_contrastive_readout_diagnostic/**'
      - '.github/workflows/v5.4.1-contrastive-readout-diagnostic.yml'
  push:
    branches:
      - 'feature/v5.4.1-contrastive-readout-diagnostic'
    paths:
      - 'v5_4_1_contrastive_readout_diagnostic/**'
      - '.github/workflows/v5.4.1-contrastive-readout-diagnostic.yml'

jobs:
  contrastive-readout-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            v5_clean
            v5_1_semantic_context
            v5_2_learned_memory
            v5_3_contrastive_memory
            v5_4_fresh_confirmatory
            v5_4_1_contrastive_readout_diagnostic
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen diagnostic dependencies
        run: python -m pip install -e './v5_clean[dev]' sentence-transformers

      - name: Recheck frozen v5.2 core
        run: pytest -q v5_2_learned_memory/tests

      - name: Recheck frozen v5.3 objective
        run: pytest -q v5_3_contrastive_memory/tests

      - name: Recheck frozen v5.4 fixture
        run: pytest -q v5_4_fresh_confirmatory/tests

      - name: Run v5.4.1 readout diagnostic
        run: python v5_4_1_contrastive_readout_diagnostic/experiments/run_contrastive_readout_diagnostic.py

      - name: Upload v5.4.1 diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5.4.1-contrastive-readout-diagnostic
          path: v5_4_1_contrastive_readout_diagnostic/outputs/contrastive_readout_diagnostic/
          if-no-files-found: error
