name: v5.8-adaptive-fast-dynamics

on:
  pull_request:
    paths:
      - 'v5_8_adaptive_fast_dynamics/**'
      - '.github/workflows/v5.8-adaptive-fast-dynamics.yml'
  push:
    branches:
      - 'feature/v5.8-adaptive-fast-dynamics'
    paths:
      - 'v5_8_adaptive_fast_dynamics/**'
      - '.github/workflows/v5.8-adaptive-fast-dynamics.yml'

jobs:
  adaptive-fast-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            v5_clean
            v5_1_semantic_context
            v5_2_learned_memory
            v5_4_fresh_confirmatory
            v5_6_dual_timescale_state
            v5_6_1_readout_temporal_diagnostic
            v5_7_residual_fast_dynamics
            v5_7_1_fast_trace_geometry
            v5_8_adaptive_fast_dynamics
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen-state and adaptive-dynamics dependencies
        run: python -m pip install -e './v5_clean[dev]' sentence-transformers

      - name: Recheck frozen v5.7 state
        run: pytest -q v5_7_residual_fast_dynamics/tests

      - name: Recheck frozen v5.7.1 geometry invariants
        run: pytest -q v5_7_1_fast_trace_geometry/tests

      - name: Verify v5.8 version boundaries and temporal-suite isolation
        run: pytest -q v5_8_adaptive_fast_dynamics/tests

      - name: Run v5.8 train-only calibration and held-out benchmark
        run: python v5_8_adaptive_fast_dynamics/experiments/run_adaptive_fast_benchmark.py

      - name: Upload v5.8 benchmark artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v5.8-adaptive-fast-dynamics-benchmark
          path: v5_8_adaptive_fast_dynamics/outputs/adaptive_fast_benchmark/
          if-no-files-found: error
