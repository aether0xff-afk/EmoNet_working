name: v5.8.1-distributed-code-diagnostic

on:
  pull_request:
    paths:
      - 'v5_8_1_distributed_code_diagnostic/**'
      - '.github/workflows/v5.8.1-distributed-code-diagnostic.yml'
  push:
    branches: ['feature/v5.8.1-distributed-code-diagnostic']

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            v5_clean
            v5_1_semantic_context
            v5_2_learned_memory
            v5_4_fresh_confirmatory
            v5_6_dual_timescale_state
            v5_6_1_readout_temporal_diagnostic
            v5_7_residual_fast_dynamics
            v5_7_1_fast_trace_geometry
            v5_8_adaptive_fast_dynamics
            v5_8_1_distributed_code_diagnostic
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e './v5_clean[dev]' sentence-transformers
      - name: Recheck frozen v5.8
        run: pytest -q v5_8_adaptive_fast_dynamics/tests
      - name: Verify diagnostic construction
        run: pytest -q v5_8_1_distributed_code_diagnostic/tests
      - name: Run diagnostic
        run: python v5_8_1_distributed_code_diagnostic/experiments/run_distributed_code_diagnostic.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: v5.8.1-distributed-code-diagnostic
          path: v5_8_1_distributed_code_diagnostic/outputs/distributed_code_diagnostic/
          if-no-files-found: error
