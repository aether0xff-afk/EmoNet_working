name: v5.8.2-benchmark-equivalence

on:
  pull_request:
    paths:
      - 'v5_8_2_benchmark_equivalence/**'
      - '.github/workflows/v5.8.2-benchmark-equivalence.yml'
  push:
    branches: ['feature/v5.8.2-benchmark-equivalence-diagnostic']

jobs:
  benchmark-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            v5_clean
            v5_1_semantic_context
            v5_2_learned_memory
            v5_4_fresh_confirmatory
            v5_6_dual_timescale_state
            v5_6_1_readout_temporal_diagnostic
            v5_7_residual_fast_dynamics
            v5_8_adaptive_fast_dynamics
            v5_8_2_benchmark_equivalence
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e './v5_clean[dev]' sentence-transformers
      - name: Recheck frozen v5.7 and v5.8 boundaries
        run: |
          pytest -q v5_7_residual_fast_dynamics/tests
          pytest -q v5_8_adaptive_fast_dynamics/tests
      - name: Verify renderer-equivalence construction
        run: pytest -q v5_8_2_benchmark_equivalence/tests
      - name: Run benchmark-equivalence diagnostic
        run: python v5_8_2_benchmark_equivalence/experiments/run_benchmark_equivalence.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: v5.8.2-benchmark-equivalence
          path: v5_8_2_benchmark_equivalence/outputs/benchmark_equivalence/
          if-no-files-found: error
