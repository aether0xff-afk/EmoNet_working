name: v5.9.1-full-trajectory-geometry

on:
  pull_request:
    paths:
      - 'v5_9_1_full_trajectory_geometry/**'
      - '.github/workflows/v5.9.1-full-trajectory-geometry.yml'
  push:
    branches: ['feature/v5.9.1-full-trajectory-geometry']

jobs:
  trajectory-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            v5_clean
            v5_6_dual_timescale_state
            v5_7_residual_fast_dynamics
            v5_8_adaptive_fast_dynamics
            v5_9_encoder_free_temporal
            v5_9_1_full_trajectory_geometry
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy-only dynamics dependencies
        run: python -m pip install -e './v5_clean[dev]'
      - name: Recheck frozen v5.7 and v5.8 dynamics
        run: |
          pytest -q v5_7_residual_fast_dynamics/tests
          pytest -q v5_8_adaptive_fast_dynamics/tests
      - name: Recheck frozen v5.9 vector worlds
        run: pytest -q v5_9_encoder_free_temporal/tests
      - name: Verify v5.9.1 trajectory geometry invariants
        run: pytest -q v5_9_1_full_trajectory_geometry/tests
      - name: Run leave-one-vector-world-out trajectory diagnostic
        run: python v5_9_1_full_trajectory_geometry/experiments/run_full_trajectory_geometry.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: v5.9.1-full-trajectory-geometry
          path: v5_9_1_full_trajectory_geometry/outputs/full_trajectory_geometry/
          if-no-files-found: error
