name: v5.9.2-trajectory-attribution

on:
  pull_request:
    paths:
      - 'v5_9_2_trajectory_attribution/**'
      - '.github/workflows/v5.9.2-trajectory-attribution.yml'
  push:
    branches: ['feature/v5.9.2-trajectory-attribution-audit']

jobs:
  trajectory-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            v5_clean
            v5_6_dual_timescale_state
            v5_7_residual_fast_dynamics
            v5_8_adaptive_fast_dynamics
            v5_9_encoder_free_temporal
            v5_9_1_full_trajectory_geometry
            v5_9_2_trajectory_attribution
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy-only dependencies
        run: python -m pip install -e './v5_clean[dev]'
      - name: Recheck frozen v5.7/v5.8/v5.9 boundaries
        run: |
          pytest -q v5_7_residual_fast_dynamics/tests
          pytest -q v5_8_adaptive_fast_dynamics/tests
          pytest -q v5_9_encoder_free_temporal/tests
      - name: Recheck frozen v5.9.1 trajectory invariants
        run: pytest -q v5_9_1_full_trajectory_geometry/tests
      - name: Verify v5.9.2 attribution construction
        run: pytest -q v5_9_2_trajectory_attribution/tests
      - name: Run leave-one-vector-world-out attribution audit
        run: python v5_9_2_trajectory_attribution/experiments/run_trajectory_attribution.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: v5.9.2-trajectory-attribution
          path: v5_9_2_trajectory_attribution/outputs/trajectory_attribution/
          if-no-files-found: error
