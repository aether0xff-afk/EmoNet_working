name: v7-context-dependence-tests

on:
  pull_request:
    paths:
      - "v7/**"
      - ".github/workflows/v7-context-dependence-tests.yml"
  push:
    branches:
      - feature/v7-snn-rebuild
    paths:
      - "v7/**"
      - ".github/workflows/v7-context-dependence-tests.yml"

jobs:
  context-dependence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v7
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run unit tests
        run: pytest -q
      - name: Run context dependence smoke experiment
        run: |
          python experiments/run_context_dependence_ablation.py \
            --encoder hash \
            --epochs 3 \
            --num-neurons 16 \
            --event-ticks 6 \
            --stimulation-ticks 2 \
            --output runs/ci_context_dependence_ablation \
            --quiet
      - name: Run multi-seed context dependence smoke experiment
        run: |
          python experiments/run_context_dependence_multiseed.py \
            --encoder hash \
            --epochs 2 \
            --num-neurons 8 \
            --event-ticks 4 \
            --stimulation-ticks 2 \
            --seeds 7 42 \
            --output runs/ci_context_dependence_multiseed \
            --quiet
      - name: Run checked context objective benchmark smoke experiment
        run: |
          python experiments/run_context_objective_benchmark_checked.py \
            --encoder hash \
            --epochs 2 \
            --num-neurons 8 \
            --event-ticks 4 \
            --stimulation-ticks 2 \
            --seeds 7 \
            --output runs/ci_context_objective_benchmark_checked \
            --quiet
      - name: Summarize checked context objective benchmark
        run: |
          python experiments/summarize_context_objective_benchmark.py \
            --input runs/ci_context_objective_benchmark_checked
      - name: Upload context experiment outputs
        uses: actions/upload-artifact@v4
        with:
          name: v7-context-dependence-results
          path: v7/runs
