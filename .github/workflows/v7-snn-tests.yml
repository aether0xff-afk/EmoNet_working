name: v7-snn-tests

on:
  pull_request:
    paths:
      - "v7/**"
      - ".github/workflows/v7-snn-tests.yml"
  push:
    branches:
      - feature/v7-snn-rebuild
    paths:
      - "v7/**"
      - ".github/workflows/v7-snn-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v7
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,text]"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run unit tests
        run: pytest -q
      - name: Run decay smoke experiment
        run: python experiments/run_decay.py --config configs/v7_0_default.yaml --output runs/ci_decay
      - name: Run selectivity wiring smoke experiment
        run: python experiments/run_selectivity.py --encoder hash --output runs/ci_selectivity_hash
      - name: Run multilingual input plumbing experiment
        run: |
          python experiments/run_selectivity.py \
            --encoder sentence-transformer \
            --model sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 \
            --output runs/ci_selectivity_multilingual
      - name: Run multi-seed multilingual selectivity suite
        run: |
          python experiments/run_selectivity_suite.py \
            --encoder sentence-transformer \
            --model sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 \
            --output runs/ci_selectivity_suite
      - name: Run offline internal-thought ablation suite
        run: |
          python experiments/run_internal_thought_ablation.py \
            --encoder sentence-transformer \
            --model sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 \
            --output runs/ci_internal_thought_ablation
      - name: Run self-supervised optimizer smoke experiment
        run: python experiments/run_self_supervised_smoke.py --output runs/ci_self_supervised_smoke --steps 20
      - name: Run persistent episode training smoke experiment
        run: |
          python experiments/train_semantic_dynamics.py \
            --encoder hash \
            --epochs 3 \
            --num-neurons 32 \
            --event-ticks 8 \
            --stimulation-ticks 3 \
            --output runs/ci_semantic_dynamics_training \
            --quiet
      - name: Upload experiment outputs
        uses: actions/upload-artifact@v4
        with:
          name: v7-snn-experiment-results
          path: v7/runs
