<line x1="90" y1="167.72" x2="940" y2="167.72" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5"/>
<text class="small" x="936" y="159.72" text-anchor="end">mean baseline</text>
<rect x="168.25" y="167.72" width="56.00" height="297.28" rx="6" fill="#9ca3af"/>
