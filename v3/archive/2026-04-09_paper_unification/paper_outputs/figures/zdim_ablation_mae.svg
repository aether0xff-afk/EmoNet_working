<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
<style>
text { font-family: 'Malgun Gothic', 'Segoe UI', sans-serif; fill: #1f2937; }
.title { font-size: 24px; font-weight: 700; }
.subtitle { font-size: 13px; fill: #6b7280; }
.axis { font-size: 12px; fill: #4b5563; }
.label { font-size: 12px; }
.small { font-size: 11px; fill: #4b5563; }
.value { font-size: 11px; font-weight: 600; }
.grid { stroke: #e5e7eb; stroke-width: 1; }
.axis-line { stroke: #9ca3af; stroke-width: 1.2; }
.note { font-size: 12px; fill: #374151; }
</style>
<rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
<text class="title" x="40" y="42">Latent Dimension Ablation</text>
<text class="subtitle" x="40" y="66">Validation MAE for z sizes 32, 64, and 128</text>
<line class="grid" x1="90" y1="110.00" x2="940" y2="110.00"/>
<text class="axis" x="82" y="114.00" text-anchor="end">0.166</text>
<line class="grid" x1="90" y1="181.00" x2="940" y2="181.00"/>
<text class="axis" x="82" y="185.00" text-anchor="end">0.133</text>
<line class="grid" x1="90" y1="252.00" x2="940" y2="252.00"/>
<text class="axis" x="82" y="256.00" text-anchor="end">0.100</text>
<line class="grid" x1="90" y1="323.00" x2="940" y2="323.00"/>
<text class="axis" x="82" y="327.00" text-anchor="end">0.066</text>
<line class="grid" x1="90" y1="394.00" x2="940" y2="394.00"/>
<text class="axis" x="82" y="398.00" text-anchor="end">0.033</text>
<line class="grid" x1="90" y1="465.00" x2="940" y2="465.00"/>
<text class="axis" x="82" y="469.00" text-anchor="end">0.000</text>
<line class="axis-line" x1="90" y1="465" x2="940" y2="465"/>
<line class="axis-line" x1="90" y1="110" x2="90" y2="465"/>
<line x1="90" y1="172.24" x2="940" y2="172.24" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5"/>
<text class="small" x="936" y="164.24" text-anchor="end">mean baseline</text>
<rect x="203.67" y="160.99" width="56.00" height="304.01" rx="6" fill="#14b8a6"/>
<text class="value" x="231.67" y="152.99" text-anchor="middle">0.1423</text>
<text class="label" x="231.67" y="485.00" text-anchor="middle">z=32</text>
<rect x="487.00" y="158.71" width="56.00" height="306.29" rx="6" fill="#2563eb"/>
<text class="value" x="515.00" y="150.71" text-anchor="middle">0.1434</text>
<text class="label" x="515.00" y="485.00" text-anchor="middle">z=64</text>
<rect x="770.33" y="156.30" width="56.00" height="308.70" rx="6" fill="#7c3aed"/>
<text class="value" x="798.33" y="148.30" text-anchor="middle">0.1445</text>
<text class="label" x="798.33" y="485.00" text-anchor="middle">z=128</text>
<text class="axis" x="32" y="94" text-anchor="start">validation MAE</text>
<text class="note" x="40" y="536">Lower is better. z=32 was the least harmful among the tested sizes.</text>
</svg>