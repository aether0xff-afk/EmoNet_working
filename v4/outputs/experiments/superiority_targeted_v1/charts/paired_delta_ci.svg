<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Paired mean total delta with bootstrap confidence intervals">
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="48" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#171717">Paired Mean Total Delta</text>
  <text x="48" y="68" font-family="Arial, sans-serif" font-size="13" fill="#525252">Bootstrap 95% confidence interval; higher is better</text>

  <line x1="150" y1="420" x2="880" y2="420" stroke="#262626" stroke-width="1.2"/>
  <line x1="150" y1="110" x2="150" y2="420" stroke="#262626" stroke-width="1.2"/>
  <g font-family="Arial, sans-serif" font-size="12" fill="#525252">
    <line x1="150" y1="420" x2="150" y2="110" stroke="#d4d4d4"/>
    <line x1="296" y1="420" x2="296" y2="110" stroke="#e5e5e5"/>
    <line x1="442" y1="420" x2="442" y2="110" stroke="#e5e5e5"/>
    <line x1="588" y1="420" x2="588" y2="110" stroke="#e5e5e5"/>
    <line x1="734" y1="420" x2="734" y2="110" stroke="#e5e5e5"/>
    <line x1="880" y1="420" x2="880" y2="110" stroke="#e5e5e5"/>
    <text x="150" y="446" text-anchor="middle">0.0</text>
    <text x="296" y="446" text-anchor="middle">0.5</text>
    <text x="442" y="446" text-anchor="middle">1.0</text>
    <text x="588" y="446" text-anchor="middle">1.5</text>
    <text x="734" y="446" text-anchor="middle">2.0</text>
    <text x="880" y="446" text-anchor="middle">2.5</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#262626">
    <text x="130" y="160" text-anchor="end">v3 vs stim_only</text>
    <line x1="607" y1="156" x2="760" y2="156" stroke="#4c78a8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="684" cy="156" r="9" fill="#4c78a8"/>
    <text x="776" y="160">+1.83 CI [+1.57, +2.09]</text>

    <text x="130" y="260" text-anchor="end">trace vs stim_only</text>
    <line x1="493" y1="256" x2="632" y2="256" stroke="#f58518" stroke-width="5" stroke-linecap="round"/>
    <circle cx="563" cy="256" r="9" fill="#f58518"/>
    <text x="648" y="260">+1.42 CI [+1.17, +1.65]</text>

    <text x="130" y="360" text-anchor="end">v3 vs trace</text>
    <line x1="191" y1="356" x2="371" y2="356" stroke="#54a24b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="282" cy="356" r="9" fill="#54a24b"/>
    <text x="388" y="360">+0.45 CI [+0.14, +0.76]</text>
  </g>
</svg>
