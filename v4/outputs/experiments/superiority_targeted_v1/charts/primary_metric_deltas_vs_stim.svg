  <line x1="250" y1="420" x2="880" y2="420" stroke="#262626" stroke-width="1.2"/>
  <line x1="250" y1="90" x2="250" y2="420" stroke="#262626" stroke-width="1.2"/>
  <g font-family="Arial, sans-serif" font-size="12" fill="#525252">
