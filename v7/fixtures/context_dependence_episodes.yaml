episodes:
  - id: train_reply_busy
    split: train
    events:
      - text: 친구가 오늘 일정이 많다고 말했다.
      - text: 아직 답장이 오지 않았다.
      - kind: internal_thought
        speaker_id: module_0
        text: 일정 때문에 답장이 늦을 수 있다.

  - id: train_reply_uncertain
    split: train
    events:
      - text: 친구와 최근 대화가 어색하게 끝났다.
      - text: 아직 답장이 오지 않았다.
      - kind: internal_thought
        speaker_id: module_0
        text: 상황을 단정하지 말고 차분하게 확인할 필요가 있다.

  - id: train_project_meeting
    split: train
    events:
      - text: 협업자가 오전에 회의가 많다고 말했다.
      - text: 아직 진행 상황을 듣지 못했다.
      - kind: internal_thought
        speaker_id: module_0
        text: 회의가 끝난 뒤 공유할 수 있다.

  - id: train_project_problem
    split: train
    events:
      - text: 협업자가 작업 중 문제를 발견했다고 말했다.
      - text: 아직 진행 상황을 듣지 못했다.
      - kind: internal_thought
        speaker_id: module_0
        text: 문제 해결 상황을 확인할 필요가 있다.

  - id: validation_reply_busy
    split: validation
    events:
      - text: 친구가 오늘 수업과 회의가 겹친다고 말했다.
      - text: 아직 답장이 오지 않았다.
      - kind: internal_thought
        speaker_id: module_0
        text: 일정 때문에 확인이 늦어진 것일 수 있다.

  - id: validation_reply_uncertain
    split: validation
    events:
      - text: 친구와 마지막 대화가 조금 어색했다.
      - text: 아직 답장이 오지 않았다.
      - kind: internal_thought
        speaker_id: module_0
        text: 이유를 단정하지 말고 상황을 확인할 필요가 있다.

  - id: validation_project_meeting
    split: validation
    events:
      - text: 협업자가 오늘 외부 일정이 많다고 말했다.
      - text: 아직 진행 상황을 듣지 못했다.
      - kind: internal_thought
        speaker_id: module_0
        text: 일정을 마친 뒤 공유할 수 있다.

  - id: validation_project_problem
    split: validation
    events:
      - text: 협업자가 예상하지 못한 문제가 생겼다고 말했다.
      - text: 아직 진행 상황을 듣지 못했다.
      - kind: internal_thought
        speaker_id: module_0
        text: 문제 해결 상황을 확인할 필요가 있다.

contrast_pairs:
  - left: validation_reply_busy
    right: validation_reply_uncertain
    step_index: 1
    relation: reply_context_contrast
  - left: validation_project_meeting
    right: validation_project_problem
    step_index: 1
    relation: project_context_contrast
