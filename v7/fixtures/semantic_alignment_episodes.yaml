  validation_valence_review_negative: {valence: 0.2, arousal: 0.5, certainty: 0.5, social_distance: 0.5}
  validation_arousal_travel_high: {valence: 0.5, arousal: 0.8, certainty: 0.5, social_distance: 0.5}
  validation_arousal_travel_low: {valence: 0.5, arousal: 0.2, certainty: 0.5, social_distance: 0.5}
  validation_arousal_backup_high: {valence: 0.5, arousal: 0.8, certainty: 0.5, social_distance: 0.5}
  validation_arousal_backup_low: {valence: 0.5, arousal: 0.2, certainty: 0.5, social_distance: 0.5}
