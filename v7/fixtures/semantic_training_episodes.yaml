episodes:
  - id: train_reply_delay_reassurance
    split: train
    events:
      - kind: user_message
        speaker_id: human
        text: 친구가 아직 답장을 하지 않았다.
      - kind: internal_thought
        speaker_id: module_0
        text: 바빠서 확인하지 못한 것일 수도 있다.
      - kind: module_message
        speaker_id: module_0
        text: 지금은 단정하지 않고 조금 더 기다려보는 편이 좋겠다.

  - id: train_reply_delay_negative
    split: train
    events:
      - kind: user_message
        speaker_id: human
        text: 친구가 답장을 읽고도 반응하지 않았다.
      - kind: internal_thought
        speaker_id: module_0
        text: 불편한 일이 있었는지 확인이 필요하다.
      - kind: module_message
        speaker_id: module_0
        text: 바로 결론을 내리기보다 상황을 차분히 물어보는 편이 좋겠다.

  - id: train_exam_overload
    split: train
    events:
      - kind: user_message
        speaker_id: human
        text: 시험 범위가 너무 넓어서 어디서부터 시작해야 할지 모르겠다.
      - kind: internal_thought
        speaker_id: module_0
        text: 범위를 작은 단위로 나누면 시작점을 정할 수 있다.
      - kind: module_message
        speaker_id: module_0
        text: 오늘 처리할 부분만 먼저 정하고 나머지는 순서대로 나누자.

  - id: train_weather_plan
    split: train
    events:
      - kind: user_message
        speaker_id: human
        text: 저녁에 비가 올 것 같은데 우산을 가져가야 할까?
      - kind: internal_thought
        speaker_id: module_0
        text: 비가 올 가능성이 있다면 작은 우산을 챙기는 편이 안전하다.
      - kind: module_message
        speaker_id: module_0
        text: 휴대하기 편한 우산을 하나 가져가자.

  - id: train_project_bug
    split: train
    events:
      - kind: user_message
        speaker_id: human
        text: 코드를 고쳤는데 같은 오류가 다시 나타났다.
      - kind: internal_thought
        speaker_id: module_0
        text: 수정한 부분 외에 재현 조건과 로그를 다시 확인해야 한다.
      - kind: module_message
        speaker_id: module_0
        text: 오류가 발생하는 입력과 로그부터 고정해서 원인을 좁히자.

  - id: train_missed_meeting
    split: train
    events:
      - kind: user_message
        speaker_id: human
        text: 약속 시간을 착각해서 친구를 기다리게 했다.
      - kind: internal_thought
        speaker_id: module_0
        text: 변명보다 먼저 상황을 인정하고 사과하는 편이 좋다.
      - kind: module_message
        speaker_id: module_0
        text: 기다리게 해서 미안하다고 말하고 다시 시간을 맞추자.

  - id: train_uncertain_result
    split: train
    events:
      - kind: user_message
        speaker_id: human
        text: 발표 결과가 아직 안 나와서 계속 신경 쓰인다.
      - kind: internal_thought
        speaker_id: module_0
        text: 결과가 나오기 전에는 추가로 판단할 정보가 없다.
      - kind: module_message
        speaker_id: module_0
        text: 확인 가능한 시점을 정하고 그전에는 다른 일을 진행하자.

  - id: train_server_connection
    split: train
    events:
      - kind: user_message
        speaker_id: human
        text: 로컬 서버에 연결하려는데 모델 목록이 보이지 않는다.
      - kind: internal_thought
        speaker_id: module_0
        text: 서버가 실행 중인지와 API 주소가 맞는지 먼저 확인해야 한다.
      - kind: module_message
        speaker_id: module_0
        text: 모델 목록 endpoint를 호출해서 연결 상태부터 점검하자.

  - id: validation_reply_delay
    split: validation
    events:
      - kind: user_message
        speaker_id: human
        text: 메시지를 보냈는데 한참 동안 답이 오지 않는다.
      - kind: internal_thought
        speaker_id: module_0
        text: 답장이 늦는 이유는 아직 확인되지 않았다.
      - kind: module_message
        speaker_id: module_0
        text: 근거 없이 결론을 내리지 말고 조금 더 기다려보자.

  - id: validation_schedule_pressure
    split: validation
    events:
      - kind: user_message
        speaker_id: human
        text: 해야 할 일이 겹쳐서 무엇부터 처리해야 할지 복잡하다.
      - kind: internal_thought
        speaker_id: module_0
        text: 우선순위와 마감 시간을 기준으로 작업을 나눌 수 있다.
      - kind: module_message
        speaker_id: module_0
        text: 가장 급한 일 하나를 고르고 나머지는 순서를 정하자.

  - id: validation_debugging
    split: validation
    events:
      - kind: user_message
        speaker_id: human
        text: 프로그램이 가끔 멈추는데 재현 조건을 모르겠다.
      - kind: internal_thought
        speaker_id: module_0
        text: 반복 실행 로그와 입력 조건을 함께 저장해야 한다.
      - kind: module_message
        speaker_id: module_0
        text: 상세 로그를 남기고 멈추는 시점의 공통점을 찾자.
